name: Generate Snake Animation

on:
  # 每天 00:00 (UTC) 自动运行一次
  schedule:
    - cron: "0 0 * * *"
  # 允许手动触发执行
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 生成贪吃蛇动画到 dist/
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 以「追加式提交」的方式把蛇的 SVG 写入 output 分支：
      # 克隆现有 output 分支 -> 仅覆盖蛇的两个文件 -> 增量提交。
      # 这样 metrics.yml 生成的 metrics*.svg 不会被删除（之前用 ghaction-github-pages
      # 会强制覆盖整个分支，导致 metrics 文件丢失）。
      - name: Publish snake svg to output branch (additive)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tmp="$(mktemp -d)"
          git clone -q --branch output --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tmp"
          cp dist/github-contribution-grid-snake*.svg "$tmp"/
          cd "$tmp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake*.svg
          git diff --quiet --cached || git commit -m "chore(snake): update contribution snake animation"
          git push -q origin output
